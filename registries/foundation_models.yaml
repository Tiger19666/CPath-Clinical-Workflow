version: 1
registry_name: computational_pathology_foundation_models
last_verified: 2026-08-26
verification_basis:
  - MahmoodLab/TRIDENT public README, current main branch
  - Official model repositories/model cards where available
notes:
  - This registry encodes compatibility metadata, not a performance leaderboard.
  - Values may change with upstream releases; local repository/model-card inspection overrides stale registry metadata.
  - Gated/access-controlled models must never be downloaded automatically without explicit user approval.

patch_encoders:
  uni_v1:
    display_name: UNI
    modality: visual
    level: patch
    family: UNI
    embedding_dim: 1024
    trident:
      patch_encoder: uni_v1
      patch_size: 256
      magnification: 20
    access: gated
    license: CC-BY-NC-ND-4.0
    roles: [visual_baseline, mil_features, retrieval, robustness]

  uni_v2:
    display_name: UNI2-h
    modality: visual
